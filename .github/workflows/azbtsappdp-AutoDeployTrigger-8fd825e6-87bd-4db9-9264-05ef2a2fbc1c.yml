name: Trigger auto deployment for azbtsappdp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/azbtsappdp-AutoDeployTrigger-8fd825e6-87bd-4db9-9264-05ef2a2fbc1c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZBTSAPPDP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZBTSAPPDP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZBTSAPPDP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: docker.io
          registryUsername: ${{ secrets.AZBTSAPPDP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AZBTSAPPDP_REGISTRY_PASSWORD }}
          containerAppName: azbtsappdp
          resourceGroup: BabyTracking
          imageToBuild: huynhtuanphat184816/azbtsappdp:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


